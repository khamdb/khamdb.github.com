<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaflet Geofence Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;font-family:Arial}#toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#f5f5f5}#address{flex:1;min-width:220px;padding:10px;font-size:16px}button{padding:10px 16px}#status{width:100%;color:#b00;font-weight:bold}#map{height:calc(100vh - 80px)}
</style></head><body>
<div id="toolbar"><input id="address" placeholder="Nhập địa chỉ"><button onclick="searchAddress()">Tìm</button><div id="status"></div></div><div id="map"></div>
<script>
const map=L.map('map').setView([10.7769,106.7009],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let target,circle,userMarker,accCircle,warnNear=false,inside=false;
const blue=L.divIcon({className:'',html:'<div style="width:18px;height:18px;background:#1976ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px #1976ff"></div>',iconSize:[18,18]});
document.getElementById('address').addEventListener('keydown',e=>{if(e.key==='Enter')searchAddress();});
async function searchAddress(){
 const q=address.value.trim(); if(!q)return;
 const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q));
 const d=await r.json(); if(!d.length){alert('Không tìm thấy');return;}
 target=L.latLng(+d[0].lat,+d[0].lon);
 if(circle)map.removeLayer(circle);
 circle=L.circle(target,{radius:3000,color:'red',fillOpacity:.2}).addTo(map);
 L.marker(target).addTo(map);
 updateView();
}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.stop(a.currentTime+.3);}catch(e){}}
function updateView(){if(userMarker&&circle){map.fitBounds(L.featureGroup([userMarker,circle]).getBounds(),{padding:[40,40]});}}
navigator.geolocation.watchPosition(p=>{
 const u=L.latLng(p.coords.latitude,p.coords.longitude);
 if(!userMarker){userMarker=L.marker(u,{icon:blue}).addTo(map);}else userMarker.setLatLng(u);
 if(!accCircle){accCircle=L.circle(u,{radius:p.coords.accuracy,color:'#1976ff',fillOpacity:.1}).addTo(map);}else{accCircle.setLatLng(u);accCircle.setRadius(p.coords.accuracy);}
 if(target){
   const remain=map.distance(u,target)-3000;
   status.textContent='Còn '+Math.max(0,remain).toFixed(0)+' m tới vòng 3 km';
   if(remain<500&&remain>0&&!warnNear){warnNear=true;beep();if(navigator.vibrate)navigator.vibrate([300,200,300]);alert('Bạn sắp vào vùng 3 km');}
   if(remain<=0&&!inside){inside=true;beep();if(navigator.vibrate)navigator.vibrate(600);alert('Bạn đã vào vùng 3 km');}
   if(remain>500)warnNear=false;
   if(remain>0)inside=false;
 }
 updateView();
},e=>console.log(e),{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
</script></body></html>
