<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghép hình cho bé</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3F2FF;--ink:#16325C;--panel:#FFFFFF;--line:#BBD6F0;--btn:#FFFFFF;--btnon:#FFD84D;
 box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B2E;--ink:#EAF2FF;--panel:#1B2B45;--line:#34507A;--btn:#243A5E}}
:root[data-theme="dark"]{--bg:#0F1B2E;--ink:#EAF2FF;--panel:#1B2B45;--line:#34507A;--btn:#243A5E;--btnon:#FFD84D}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
h1{font-size:clamp(18px,3.4vw,28px);margin:0;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--btn);font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink);font-family:inherit}
.b[aria-pressed="true"]{background:var(--btnon);border-color:#E0A800}
.b:focus-visible,.go:focus-visible{outline:4px solid #2F7CF6;outline-offset:2px}
#area{flex:1;position:relative;min-height:0}
#stage{position:absolute;transform-origin:0 0}
#tray{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:28px}
#stage svg{display:block;overflow:visible}
.t,.p{position:absolute}
.p{cursor:grab;touch-action:none;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1);z-index:2}
.p.drag{transition:none;z-index:9;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.p.ok{pointer-events:none;z-index:1;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,25,50,.45);z-index:20}
#ov.on{display:grid}
#card{background:var(--panel);border-radius:32px;padding:28px 36px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#card h2{font-size:clamp(34px,8vw,56px);margin:0 0 16px;font-weight:900;color:#16A34A}
.go{font-family:inherit;font-size:26px;font-weight:900;border:0;border-radius:999px;padding:14px 36px;background:#22C55E;color:#fff;cursor:pointer;min-height:56px}
.c{position:absolute;top:-20px;width:12px;height:18px;z-index:30;animation:fall 2.2s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.p,.p.ok{transition:none;animation:none}.c{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <button class="b" id="l0" aria-label="Cái cây">🌳</button>
    <button class="b" id="l1" aria-label="Ngôi nhà">🏠</button>
    <button class="b" id="l2" aria-label="Con thuyền">⛵</button>
    <button class="b" id="rs" aria-label="Xếp lại">↻</button>
  </header>
  <div id="area"><div id="stage"></div></div>
  <div id="ov"><div id="card"><h2>Giỏi quá!</h2><button class="go" id="next">Tiếp tục</button></div></div>
</div>
<script>
const COL={g:'#22C55E',br:'#92400E',y:'#FACC15',b:'#3B82F6',r:'#EF4444'};
// shape, color, x, y, w, h  (silhouette area is 600 x 560)
const LV=[
 {name:'Cái cây',p:[['e','g',190,90,200,200],['r','br',260,290,60,150],['e','y',460,60,90,90]]},
 {name:'Ngôi nhà',p:[['r','b',190,260,200,200],['t','r',160,140,260,120],['r','g',255,350,70,110],['e','y',450,70,90,90]]},
 {name:'Con thuyền',p:[['r','b',140,380,280,80],['t','r',295,200,130,170],['r','br',265,180,25,200],['e','y',480,70,90,90]]}
];
const $=s=>document.querySelector(s), stage=$('#stage'), area=$('#area');
let lv=0, placed=new Set(), mode='', scale=1, S={w:0,h:0}, AC=null;

function shape(k,w,h,col,ghost){
  const a=ghost?`fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="5" stroke-dasharray="14 10" stroke-linejoin="round"`:`fill="${col}" stroke="#fff" stroke-width="3" stroke-linejoin="round"`;
  let s;
  if(k==='r')s=`<rect x="3" y="3" width="${w-6}" height="${h-6}" rx="8" ${a}/>`;
  else if(k==='e')s=`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-3}" ry="${h/2-3}" ${a}/>`;
  else s=`<polygon points="${w/2},3 ${w-3},${h-3} 3,${h-3}" ${a}/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}
function tone(f,t,d,v=.18){ // short sine note
  if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const n=AC.currentTime+t;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.start(n);o.stop(n+d+.05);
}
function unlock(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
document.addEventListener('pointerdown',unlock);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function build(){
  const r=area.getBoundingClientRect();
  mode=r.height>r.width*1.05?'p':'l';
  S=mode==='l'?{w:1000,h:560}:{w:600,h:1000};
  const tr=mode==='l'?{x:630,y:20,w:350,h:520}:{x:20,y:600,w:560,h:380};
  stage.innerHTML='';stage.style.width=S.w+'px';stage.style.height=S.h+'px';
  const tray=document.createElement('div');tray.id='tray';
  Object.assign(tray.style,{left:tr.x+'px',top:tr.y+'px',width:tr.w+'px',height:tr.h+'px'});stage.append(tray);
  const L=LV[lv];
  L.p.forEach((p,i)=>{ if(placed.has(i))return;
    const d=document.createElement('div');d.className='t';
    Object.assign(d.style,{left:p[2]+'px',top:p[3]+'px'});d.innerHTML=shape(p[0],p[4],p[5],COL[p[1]],true);stage.append(d);});
  // pack loose pieces into the tray
  const loose=shuffle(L.p.map((p,i)=>i).filter(i=>!placed.has(i)));
  let x=tr.x+18,y=tr.y+18,rowH=0;
  const home={};
  loose.forEach(i=>{const w=L.p[i][4],h=L.p[i][5];
    if(x+w>tr.x+tr.w-18){x=tr.x+18;y+=rowH+22;rowH=0}
    home[i]=[x,y];x+=w+22;rowH=Math.max(rowH,h);});
  L.p.forEach((p,i)=>{
    const d=document.createElement('div');d.className='p';
    const w=p[4],h=p[5];d.style.width=w+'px';d.style.height=h+'px';d.innerHTML=shape(p[0],w,h,COL[p[1]],false);
    if(placed.has(i)){d.style.left=p[2]+'px';d.style.top=p[3]+'px';d.classList.add('ok');d.style.animation='none';}
    else{d.style.left=home[i][0]+'px';d.style.top=home[i][1]+'px';drag(d,i,home[i]);}
    stage.append(d);
  });
  fit();
  $('#title').textContent=L.name;
  [0,1,2].forEach(i=>$('#l'+i).setAttribute('aria-pressed',i===lv));
}
function fit(){
  const r=area.getBoundingClientRect();
  scale=Math.min(r.width/S.w,r.height/S.h);
  stage.style.transform=`scale(${scale})`;
  stage.style.left=(r.width-S.w*scale)/2+'px';stage.style.top=(r.height-S.h*scale)/2+'px';
}
function drag(d,i,h){
  let sx,sy,ox,oy,on=false;
  d.addEventListener('pointerdown',e=>{on=true;d.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(d.style.left);oy=parseFloat(d.style.top);d.classList.add('drag');e.preventDefault()});
  d.addEventListener('pointermove',e=>{if(!on)return;d.style.left=ox+(e.clientX-sx)/scale+'px';d.style.top=oy+(e.clientY-sy)/scale+'px'});
  const end=()=>{ if(!on)return;on=false;d.classList.remove('drag');
    const p=LV[lv].p[i],x=parseFloat(d.style.left),y=parseFloat(d.style.top);
    if(Math.hypot(x-p[2],y-p[3])<60){
      d.style.left=p[2]+'px';d.style.top=p[3]+'px';d.classList.add('ok');placed.add(i);
      [...stage.querySelectorAll('.t')].forEach(t=>{if(Math.abs(parseFloat(t.style.left)-p[2])<1&&Math.abs(parseFloat(t.style.top)-p[3])<1)t.remove()});
      tone(880,0,.25);tone(1320,.09,.3);
      if(placed.size===LV[lv].p.length)setTimeout(win,450);
    }else{d.style.left=h[0]+'px';d.style.top=h[1]+'px'}
  };
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
}
function win(){
  [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.4));
  try{const u=new SpeechSynthesisUtterance('Giỏi quá!');u.lang='vi-VN';speechSynthesis.speak(u)}catch(e){}
  $('#next').textContent=lv<LV.length-1?'Level tiếp theo':'Chơi lại';
  $('#ov').classList.add('on');
  const cols=Object.values(COL);
  for(let i=0;i<40;i++){const c=document.createElement('i');c.className='c';
    c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.animationDelay=Math.random()*.6+'s';
    $('#app').append(c);setTimeout(()=>c.remove(),3200);}
}
function go(n){lv=n;placed=new Set();$('#ov').classList.remove('on');build()}
[0,1,2].forEach(i=>$('#l'+i).onclick=()=>go(i));
$('#rs').onclick=()=>go(lv);
$('#next').onclick=()=>go((lv+1)%LV.length);

new ResizeObserver(()=>{const r=area.getBoundingClientRect();const m=r.height>r.width*1.05?'p':'l';if(m!==mode)build();else fit()}).observe(area);
build();
</script>
</body>
</html>
