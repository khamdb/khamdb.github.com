html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
h1{font-size:clamp(20px,3.6vw,30px);margin:0;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--btn);font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink);font-family:inherit}
.b:focus-visible,.go:focus-visible,.m:focus-visible{outline:4px solid #2F7CF6;outline-offset:2px}
#area{flex:1;position:relative;min-height:0}
#stage{position:absolute;transform-origin:0 0}
#tray{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:28px}
#stage svg{display:block;overflow:visible}
.t,.p{position:absolute}
.t{z-index:30;pointer-events:none}
.p{cursor:grab;touch-action:none;z-index:40;transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1),transform .2s}
.p::before{content:"";position:absolute;inset:-14px}
.p.drag{transition:transform .15s;z-index:100;filter:drop-shadow(0 8px 8px rgba(0,0,0,.28))}
.p.ok{pointer-events:none;cursor:default}
.p.ok.new{animation:pop .4s}
@keyframes pop{50%{filter:brightness(1.3)}}
.ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,25,50,.5);z-index:200}
.ov.on{display:grid}
#card{background:var(--panel);border-radius:32px;padding:28px 36px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#card h2{font-size:clamp(34px,8vw,56px);margin:0 0 16px;font-weight:900;color:#16A34A}
.go{font-family:inherit;font-size:26px;font-weight:900;border:0;border-radius:999px;padding:14px 36px;background:#22C55E;color:#fff;cursor:pointer;min-height:56px}
#menu .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--panel);padding:18px;border-radius:28px;width:min(92vw,520px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.m{font-family:inherit;border:3px solid var(--line);background:var(--btn);color:var(--ink);border-radius:20px;padding:12px 4px;cursor:pointer;font-size:15px;font-weight:900;position:relative;min-height:96px}
.m span{display:block;font-size:40px;line-height:1.2}
.m.cur{background:var(--on);border-color:#E0A800;color:#16325C}
.m i{position:absolute;top:4px;right:8px;font-style:normal;font-size:18px}
.c{position:absolute;top:-20px;width:12px;height:18px;z-index:300;animation:fall 2.2s ease-in forwards;pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:12px;display:none;justify-content:center;z-index:150}
#bar.on{display:flex}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.p,.p.ok.new{transition:none;animation:none}.c{display:none}}
</style>

function prepare(L){
  const P=L.p.map(p=>{const r=p.r*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r));
    return {...p,cx:p.x+p.w/2,cy:p.y+p.h/2,aw:p.w*c+p.h*s,ah:p.w*s+p.h*c}});
  let a=1e9,b=1e9,c=-1e9,d=-1e9;

    cx:300+(p.cx-(a+c)/2)*f,cy:280+(p.cy-(b+d)/2)*f}));
  R.box={l:300-(c-a)/2*f,r:300+(c-a)/2*f,t:280-(d-b)/2*f,b:280+(d-b)/2*f};return R;
}

function pack(items,W,k,gap){
  const rows=[];let cur={its:[],w:0,h:0};
  for(const it of items){const w=it.aw*k,h=it.ah*k;
    if(cur.its.length&&cur.w+gap+w>W){rows.push(cur);cur={its:[],w:0,h:0}}

      else if(c<11.2){const a=Math.sin(2*Math.PI*(c-6.4)/1.6);aL=-70+140*(.5+.5*a);aR=-70+140*(.5-.5*a);sw=3*a}     // giơ tay luân phiên
      else{const s=Math.sin(2*Math.PI*(c-11.2)/1.2);lL=22*Math.max(0,s);lR=22*Math.max(0,-s);aL=35*s;aR=-35*s;hop=-6*Math.abs(s)}   // đá chân luân phiên
      const k2=Math.min(1,dt*10);pz.aL+=(aL-pz.aL)*k2;pz.aR+=(aR-pz.aR)*k2;pz.lL+=(lL-pz.lL)*k2;pz.lR+=(lR-pz.lR)*k2;pz.hop+=(hop-pz.hop)*k2;pz.sw+=(sw-pz.sw)*k2;
      td=pz.sw;P=toP(C[0],C[1]);P[1]+=pz.hop}
    else if(has('bay_vong')){const ph=90+360*tt/8,p=pos(ph),v=[-rx*Math.sin(ph*D2R),ry*Math.cos(ph*D2R)];
      let h=Math.atan2(v[1],v[0])/D2R+90;h+=360*Math.round(((ph-180)-h)/360);
      P=toP(p[0],p[1]);rot=lerp(0,h,u);
      if(flame){flame.style.opacity=u;flame.style.transform=`scaleY(${1+.25*Math.sin(t*30)+.1*Math.sin(t*53)})`}}
    else if(has('boi')){const w=2*Math.PI*tt/16;if(!noflip)ftT=Math.sign(Math.cos(w))||ftT;
      bob=6*Math.sin(2*Math.PI*t/1.9);rot=4*Math.sin(2*Math.PI*t/2.3);P=toP(C[0]+rx*Math.sin(w),Y0);
      waveB.style.transform=`translateX(${-(t*40%100)}px)`;waveF.style.transform=`translateX(${(t*65%100)-100}px)`}
    else{
      let c=tt%total,i=0;while(i<segs.length-1&&c>=segs[i].d){c-=segs[i].d;i++}
      const sg=segs[i];let ph;si=i;
      if(sg.at!==undefined){ph=sg.at;pk=c/.8;const w=Math.pow(Math.sin(Math.PI*(pk%1)),2);hd=28*w;td=24*w}
      else{ph=lerp(sg.a,sg.b,ease(c/sg.d));const s=Math.sin(ph*D2R);if(Math.abs(s)>.15&&!noflip)ftT=Math.sign(-s);
        if(has('di_vong')){legA=22;armA=20;bob=-4*Math.abs(Math.sin(2*Math.PI*1.6*tt))}else bob=-2.5*Math.abs(Math.sin(2*Math.PI*3*tt))}
      const p=pos(ph);P=toP(p[0],p[1]);dist=arc(ph,Math.floor(tt/total));
    }
    if(has('noi')){const w=Math.floor(tt/7);inS=tt>.3&&(tt%7)<2.8;if(inS&&w!==spoken){spoken=w;say()}}
    fc+=(ftT-fc)*Math.min(1,dt*7);
    fig.style.transform=`translate(${P[0]-300}px,${P[1]-oy+bob}px) rotate(${rot}deg) scale(${fc*base*scc},${scc})`;
    tilt.style.transform=`rotate(${td}deg)`;
    if(headW)headW.style.transform=`rotate(${hd}deg)`;
    const tap=has('tap_the_duc');
    legW.forEach((o,i)=>o.w.style.transform=`rotate(${tap?o.s*(o.s>0?pz.lL:pz.lR):legA*Math.sin(2*Math.PI*1.6*tt+i*Math.PI)}deg)`);
    armW.forEach(o=>o.w.style.transform=`rotate(${tap?o.s*(o.s>0?pz.aL:pz.aR):armA*Math.sin(2*Math.PI*1.6*tt)}deg)`);
    wheelW.forEach(o=>o.w.style.transform=`rotate(${dist/(o.r*sc)/D2R}deg)`);
    mouthW.forEach(w=>w.style.transform=`scale(1,${inS?.3+1.2*Math.abs(Math.sin(2*Math.PI*4.5*tt)):1})`);
    if(petW)petW.style.transform=`rotate(${spin}deg)`;
    if(bub){bub.style.left=Math.min(S.w-120,Math.max(120,P[0]))+'px';bub.style.top=Math.max(70,P[1]+bob+(B.t-280)*scc-16)+'px';bub.style.opacity=inS?1:0}
    if(deco)deco(t);
    grains.forEach((gs,j)=>{const n=si<2*j+1?3:si===2*j+1?3-Math.floor(pk+.5):0;gs.forEach((e,k)=>e.style.opacity=k<n?1:0)});
    raf=requestAnimationFrame(frame);
  }
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)raf=requestAnimationFrame(frame);
}
/* ---- âm thanh của hình (khai báo am_thanh trong Notes). Dùng một thẻ audio duy nhất để iPad/Safari cho phép phát ---- */
const sfx=new Audio();let sfxTimer=0,sfxOK=false;
const SILENT='data:audio/wav;base64,UklGRogAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWQAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
function unlockSfx(){if(sfxOK)return;sfxOK=true;try{sfx.src=SILENT;const p=sfx.play();if(p)p.then(()=>sfx.pause()).catch(()=>{})}catch(e){}}
function stopSound(){clearInterval(sfxTimer);sfxTimer=0;try{sfx.pause();sfx.loop=false}catch(e){}}
function playSound(s){
  stopSound();if(!s)return;
  const go=()=>{try{sfx.loop=s.l===-1;sfx.src=s.f;sfx.currentTime=0;const p=sfx.play();if(p)p.catch(()=>{})}catch(e){}};
  go();if(s.l>0)sfxTimer=setInterval(go,s.l*1000);
}
function go(n){lv=n;used=new Map();$('#ov').classList.remove('on');$('#menu').classList.remove('on');build()}
function menu(){
  $('#grid').innerHTML=DATA.map((l,i)=>`<button class="m${i===lv?' cur':''}" data-i="${i}">${done.has(i)?'<i>⭐</i>':''}<span>${l.e}</span>${l.n}</button>`).join('');
  $('#menu').classList.add('on');
}
$('#grid').onclick=e=>{const b=e.target.closest('.m');if(b)go(+b.dataset.i)};
$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').classList.remove('on')};
$('#mn').onclick=menu;$('#rs').onclick=()=>go(lv);
$('#nx2').onclick=()=>go((lv+1)%DATA.length);
$('#next').onclick=()=>go((lv+1)%DATA.length);
new ResizeObserver(()=>{const r=area.getBoundingClientRect();const m=r.height>r.width*1.05?'p':'l';if(m!==mode||raf)build();else fit()}).observe(area);
build();
