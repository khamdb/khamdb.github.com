<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghép hình cho bé</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3F2FF;--ink:#16325C;--panel:#FFFFFF;--line:#BBD6F0;--btn:#FFFFFF;--on:#FFD84D;
 box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B2E;--ink:#EAF2FF;--panel:#1B2B45;--line:#34507A;--btn:#243A5E}}
:root[data-theme="dark"]{--bg:#0F1B2E;--ink:#EAF2FF;--panel:#1B2B45;--line:#34507A;--btn:#243A5E}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
h1{font-size:clamp(20px,3.6vw,30px);margin:0;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--btn);font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink);font-family:inherit}
.b:focus-visible,.go:focus-visible,.m:focus-visible{outline:4px solid #2F7CF6;outline-offset:2px}
#area{flex:1;position:relative;min-height:0}
#stage{position:absolute;transform-origin:0 0}
#tray{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:28px}
#stage svg{display:block;overflow:visible}
.t,.p{position:absolute}
.t{z-index:30;pointer-events:none}
.p{cursor:grab;touch-action:none;z-index:40;transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1),transform .2s}
.p::before{content:"";position:absolute;inset:-14px}
.p.drag{transition:transform .15s;z-index:100;filter:drop-shadow(0 8px 8px rgba(0,0,0,.28))}
.p.ok{pointer-events:none;cursor:default}
.p.ok.new{animation:pop .4s}
@keyframes pop{50%{filter:brightness(1.3)}}
.ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,25,50,.5);z-index:200}
.ov.on{display:grid}
#card{background:var(--panel);border-radius:32px;padding:28px 36px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#card h2{font-size:clamp(34px,8vw,56px);margin:0 0 16px;font-weight:900;color:#16A34A}
.go{font-family:inherit;font-size:26px;font-weight:900;border:0;border-radius:999px;padding:14px 36px;background:#22C55E;color:#fff;cursor:pointer;min-height:56px;white-space:nowrap}
@media (max-width:520px){.go{font-size:20px;padding:12px 22px}}
#menu .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--panel);padding:18px;border-radius:28px;width:min(92vw,520px);box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92%;overflow-y:auto;touch-action:pan-y}
.m{font-family:inherit;border:3px solid var(--line);background:var(--btn);color:var(--ink);border-radius:20px;padding:12px 4px;cursor:pointer;font-size:15px;font-weight:900;position:relative;min-height:96px}
.m span{display:block;font-size:40px;line-height:1.2}
.m.cur{background:var(--on);border-color:#E0A800;color:#16325C}
.m i{position:absolute;top:4px;right:8px;font-style:normal;font-size:18px}
.c{position:absolute;top:-20px;width:12px;height:18px;z-index:300;animation:fall 2.2s ease-in forwards;pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:12px;display:none;justify-content:center;gap:12px;z-index:150}
.go.alt{background:#3B82F6}
#bar.on{display:flex}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.p,.p.ok.new{transition:none;animation:none}.c{display:none}}
</style>
</head>

  async function trick2(round,ob){
    SH.mode='idle';
    await talk(round?9:8);
    const SX=i=>cx+(i-1)*SPC;let k=0;
    const hats=[0,1,2].map(i=>{
      const el=mk(`width:160px;height:160px;transform-origin:50% 100%;pointer-events:auto;cursor:pointer;opacity:0`);el.className='hat';
      el.append(propEl(D_HAT[i]));
      return{i,el,hd:el.lastChild,slot:i,x:SX(i),dy:0,dep:1,z:2,lift:LIFT,rot:0,up:false};
    });
    const setHat=h=>{h.el.style.left=h.x-80+'px';h.el.style.top=gy-160+h.dy+'px';h.el.style.zIndex=h.z;h.el.style.transform=`scale(${HS*h.dep})`;h.hd.style.transform=`translateY(${-h.lift}px) rotate(${h.rot}deg)`};
    hats.forEach(setHat);
    /* 1) cho bé xem đồ vật, rồi đồ vật biến mất: bé không biết nó đi đâu */
    const oe=add(propEl(ob));const OS=land?1.5:1.35;
    notes([523,659,784]);await tw(600,u=>place(oe,ob,cx,cy+30,ez.back(u)*OS));
    await talk(10);
    burst(cx,cy+30,16);tone(880,0,.15,.15);tone(1175,.1,.2,.15);
    await tw(400,u=>place(oe,ob,cx,cy+30,OS*(1-u)));oe.remove();
    /* 2) ba cái mũ rơi xuống, đều trống */
    hats.forEach(h=>{h.el.style.opacity=1});
    await Promise.all(hats.map((h,i)=>Wt(i*260).then(()=>tw(600,u=>{h.lift=LIFT*(1-ez.bounce(u));setHat(h)})).then(()=>tone(196,0,.12,.2))));
    await Wt(300);
    /* 3) màn đêm phủ xuống, bé nhắm mắt, chú hề bí mật giấu đồ vật vào một mũ ngẫu nhiên */
    const nt=mk(`left:0;top:0;width:${S.w}px;height:${S.h}px;background:#16325C;opacity:0;z-index:100;pointer-events:none`);
    for(let q=0;q<16;q++){const s=6+Math.random()*10,st=document.createElement('i');
      st.style.cssText=`position:absolute;left:${Math.random()*S.w}px;top:${Math.random()*S.h*.9}px;width:${s}px;height:${s}px;background:#FACC15;border-radius:50%`;
      if(st.animate)st.animate([{opacity:.2},{opacity:.95},{opacity:.2}],{duration:900+Math.random()*900,iterations:Infinity,delay:Math.random()*600});nt.append(st)}
    await tw(600,u=>{nt.style.opacity=.96*u});
    k=Math.random()*3|0;
    const o=propEl(ob);o.className='ob';o.style.transformOrigin='0 0';o.style.left='37px';o.style.top='70px';o.style.transform='scale(.72)';hats[k].el.insertBefore(o,hats[k].hd);
    await talk(11,300);
    await tw(600,u=>{nt.style.opacity=.96*(1-u)});
    nt.remove();
    SH.mode='shuffle';await talk(12,200);
    const n=round?5:3,dur=round?780:1100;let last='';
    for(let s=0;s<n;s++){
      let pr;do{pr=[[0,1],[1,2],[0,2]][Math.random()*3|0]}while(pr.join()===last);last=pr.join();
      const a=hats.find(h=>h.slot===pr[0]),b=hats.find(h=>h.slot===pr[1]),xa=SX(pr[0]),xb=SX(pr[1]);
      await tw(dur,u=>{const e=ease(u),arc=Math.sin(Math.PI*u);a.x=lerp(xa,xb,e);b.x=lerp(xb,xa,e);a.dy=-55*arc;b.dy=18*arc;a.dep=1+.12*arc;b.dep=1-.08*arc;a.z=3;b.z=1;setHat(a);setHat(b)});
      a.slot=pr[1];b.slot=pr[0];a.dy=b.dy=0;a.dep=b.dep=1;a.z=b.z=2;setHat(a);setHat(b);tone(300,0,.08,.12);
      await Wt(160);
    }
    SH.mode='idle';
    let armed=true,wrong=0,fin;
    const done=new Promise(r=>{fin=r});
    const wob=t=>hats.forEach(h=>{if(armed&&!h.up){h.rot=4*Math.sin(t*5+h.i*2);setHat(h)}});ticks.add(wob);
    const iv=setInterval(()=>{if(tk!==showTok){clearInterval(iv);return}if(armed)talk(13,0)},15000);
    const lift=h=>{h.up=true;h.rot=0;return tw(450,u=>{h.lift=LIFT*ez.out(u);setHat(h)})};
    hats.forEach(h=>{h.el.onpointerdown=async e=>{
      if(!armed||h.up)return;e.preventDefault();
      if(h.i===k){
        armed=false;lift(h);notes([523,659,784,1047],.12,.4);burst(h.x,gy-70,28);SH.mode='cheer';
        const o=h.el.querySelector('.ob');if(o&&o.animate)o.animate([{transform:'scale(.72) translateY(0)'},{transform:'scale(.72) translateY(-45px)'},{transform:'scale(.72) translateY(0)'}],{duration:600,iterations:3,delay:300});
        talk(14,0);
        await Wt(1400);hats.forEach(o2=>{if(!o2.up)lift(o2)});await Wt(1800);fin();
      }else{
        lift(h);tone(330,0,.18,.15);tone(262,.15,.3,.15);
        talk(wrong++?16:15,0);
      }}});
    await talk(13,0);
    await done;
    clearInterval(iv);ticks.delete(wob);
    await Promise.all(hats.map(h=>tw(500,u=>{h.el.style.opacity=1-u})));
    hats.forEach(h=>h.el.remove());
  }

  (async()=>{
    await Wt(1300);
    if(!tr.includes('hoa_chim')){SH.mode='wave';await talk(1)}
    if(tr.includes('hoa_chim'))await trick1();
    if(tr.includes('tim_do')){const ord=D_OBJ.slice().sort(()=>Math.random()-.5);for(let r=0;r<2;r++)await trick2(r,ord[r])}
    SH.mode='wave';await talk(17,0);
  })();
}
/* ---- âm thanh của hình (khai báo am_thanh trong Notes). Dùng một thẻ audio duy nhất để iPad/Safari cho phép phát ---- */
const sfx=new Audio();let sfxTimer=0,sfxOK=false;
const SILENT='data:audio/wav;base64,UklGRogAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWQAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
function unlockSfx(){if(sfxOK)return;sfxOK=true;try{sfx.src=SILENT;const p=sfx.play();if(p)p.then(()=>sfx.pause()).catch(()=>{})}catch(e){}try{vox.src=SILENT;const q=vox.play();if(q)q.then(()=>vox.pause()).catch(()=>{})}catch(e){}}
function stopSound(){clearInterval(sfxTimer);sfxTimer=0;try{sfx.pause();sfx.loop=false}catch(e){}}
function playSound(s){
  stopSound();if(!s)return;
  const go=()=>{try{sfx.loop=s.l===-1;sfx.src=s.f;sfx.currentTime=0;const p=sfx.play();if(p)p.catch(()=>{})}catch(e){}};
  go();if(s.l>0)sfxTimer=setInterval(go,s.l*1000);
}
function go(n){lv=n;used=new Map();$('#ov').classList.remove('on');$('#menu').classList.remove('on');build()}
function menu(){
  $('#grid').innerHTML=DATA.map((l,i)=>`<button class="m${i===lv?' cur':''}" data-i="${i}">${done.has(i)?'<i>⭐</i>':''}<span>${l.e}</span>${l.n}</button>`).join('');
  $('#menu').classList.add('on');
}
$('#grid').onclick=e=>{const b=e.target.closest('.m');if(b)go(+b.dataset.i)};
$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').classList.remove('on')};
$('#mn').onclick=menu;$('#rs').onclick=()=>go(lv);
$('#nx2').onclick=()=>go((lv+1)%DATA.length);
$('#rp').onclick=()=>build();   // làm lại màn trình diễn, giữ nguyên hình đã ghép
$('#next').onclick=()=>go((lv+1)%DATA.length);
new ResizeObserver(()=>{const r=area.getBoundingClientRect();const m=r.height>r.width*1.05?'p':'l';if(m!==mode||(raf&&!showOn))build();else fit()}).observe(area);
build();
</script>
